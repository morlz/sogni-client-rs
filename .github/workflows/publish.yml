name: GitHub alpha release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-alpha-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Sogni-AI/sogni-client-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings
    outputs:
      version: ${{ steps.release.outputs.version }}
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release identity
        id: release
        run: python3 .github/scripts/release.py verify
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo test --all-targets --all-features --locked
      - run: cargo test --all-targets --no-default-features --locked
      - run: cargo test --doc --all-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - run: cargo doc --lib --examples --all-features --no-deps --locked
      - run: python3 .github/scripts/test_release.py
      - run: cargo package --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings

  publish:
    needs: verify
    if: needs.verify.outputs.already_published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve tag and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 .github/scripts/release.py tag
          gh release create "v$VERSION" --verify-tag --prerelease --latest=false --title "Rust community alpha $VERSION" --notes-file ALPHA_RELEASE.md
