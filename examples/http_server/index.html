<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sogni Axum Demo</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #f9fafb; }
    main { width: min(960px, calc(100% - 2rem)); margin: 3rem auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    form, .preview { padding: 1.25rem; border: 1px solid #374151; border-radius: .75rem; background: #1f2937; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
    textarea, select, button { box-sizing: border-box; width: 100%; padding: .75rem; border-radius: .4rem; font: inherit; }
    textarea, select { border: 1px solid #4b5563; background: #111827; color: inherit; }
    button { margin-top: 1rem; border: 0; background: #7c3aed; color: white; cursor: pointer; font-weight: 700; }
    button:disabled { opacity: .55; cursor: wait; }
    img { width: 100%; height: auto; border-radius: .5rem; }
    #status { min-height: 1.5rem; }
  </style>
</head>
<body>
<main>
  <h1>Sogni image demo</h1>
  <div class="grid">
    <form id="generate-form">
      <label for="prompt">What would you like to imagine?</label>
      <textarea id="prompt" maxlength="2000" rows="5" required></textarea>
      <label for="style">Image style</label>
      <select id="style"></select>
      <button id="submit" type="submit">Estimate and imagine</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <section class="preview" aria-label="Generated image"><img id="result" alt=""></section>
  </div>
</main>
<script>
(() => {
  const presets = [
    ['Anime', 'amazing, award-winning, anime'],
    ['Cartoon', 'cartoon, stylized, exaggerated features, vibrant colors, playful'],
    ['Comic Book', 'comic book style, dynamic, vibrant, action-packed'],
    ['Cyberpunk', 'high-tech, neon colors, futuristic cityscapes'],
    ['Fantasy', 'magical, mythical creatures, enchanting environments'],
    ['Realistic', 'photorealistic, highly detailed, real-world, realistic lighting']
  ];
  const form = document.querySelector('#generate-form');
  const style = document.querySelector('#style');
  const button = document.querySelector('#submit');
  const status = document.querySelector('#status');
  const image = document.querySelector('#result');
  for (const [title, value] of presets) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = title;
    style.append(option);
  }
  async function jsonPost(path, body) {
    const response = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
    return data;
  }
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    const input = { prompt: document.querySelector('#prompt').value, style: style.value };
    try {
      status.textContent = 'Fetching cost estimate…';
      const quote = await jsonPost('/api/estimate', input);
      const spark = JSON.stringify(quote.estimate.spark);
      if (!window.confirm(`Estimated cost: ${spark} Spark. Submit this paid generation?`)) {
        status.textContent = 'Cancelled.';
        return;
      }
      status.textContent = 'Generating…';
      const result = await jsonPost('/api/generate', { ...input, confirmed: true });
      image.src = result.url;
      image.alt = input.prompt;
      status.textContent = 'Complete.';
    } catch (error) {
      status.textContent = error instanceof Error ? error.message : 'Generation failed.';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
