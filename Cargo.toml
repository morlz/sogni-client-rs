[package]
name = "sogni-client"
version = "5.50.3-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Community-origin Rust SDK for Sogni, maintained as a Sogni-AI alpha fork"
license = "ISC"
repository = "https://github.com/Sogni-AI/sogni-client-rs"
homepage = "https://www.sogni.ai"
documentation = "https://github.com/Sogni-AI/sogni-client-rs#readme"
readme = "README.md"
publish = false
keywords = ["sogni", "generative-ai", "image", "video", "llm"]
categories = ["api-bindings", "asynchronous", "multimedia"]
include = [
  "src/**",
  "data/**",
  "examples/**",
  "tests/**",
  "AGENTS.md",
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
  "CONTRIBUTING.md",
  "UPSTREAM.md",
  "ALPHA_RELEASE.md",
  "SECURITY.md",
  "llms.txt",
  "llms-full.txt",
]

[features]
default = ["wallet"]
wallet = ["dep:ethers-core", "dep:ethers-signers", "dep:pbkdf2"]

[dependencies]
async-stream = "0.3.6"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["clock", "serde"] }
ethers-core = { version = "2.0.14", optional = true }
ethers-signers = { version = "2.0.14", default-features = false, optional = true }
futures-util = { version = "0.3.31", features = ["sink"] }
mime_guess = "2.0.5"
parking_lot = "0.12.4"
percent-encoding = "2.3.2"
pbkdf2 = { version = "0.12.2", optional = true }
rand = "0.9.2"
regex = "1.11.2"
reqwest = { version = "0.12.23", default-features = false, features = ["cookies", "http2", "json", "multipart", "rustls-tls-native-roots", "socks", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
# Keep the transitive cookie parser on a patched version for Git consumers too.
time = { version = "0.3.47", default-features = false }
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-socks = "=0.5.3"
tokio-tungstenite = { version = "0.27.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing = "0.1.41"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.8.1"

[dev-dependencies]
anyhow = "1.0.103"
axum = { version = "=0.8.4", features = ["http1", "json", "tokio"] }
clap = { version = "=4.5.47", features = ["derive"] }
image = { version = "=0.25.5", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
pretty_assertions = "1.4.1"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs"] }
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Preserve upstream syntax conventions when raising the dependency MSRV,
# keeping recurring upstream merges focused on behavior.
collapsible_if = "allow"
collapsible_match = "allow"
